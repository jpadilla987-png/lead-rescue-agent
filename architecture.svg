<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="820" viewBox="0 0 1400 820">
  <rect width="1400" height="820" fill="#07110e"/>
  <style>
    .box{fill:#10231d;stroke:#2f6f57;stroke-width:2;rx:18}.core{fill:#173c30;stroke:#75f0b1;stroke-width:3;rx:22}.human{fill:#3a2d15;stroke:#ffd17b;stroke-width:2;rx:18}.t{fill:#f4fff9;font:700 25px Arial}.s{fill:#a9c0b6;font:18px Arial}.line{stroke:#5d927b;stroke-width:3;fill:none;marker-end:url(#a)}
  </style>
  <defs><marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5d927b"/></marker></defs>
  <text x="70" y="70" class="t" font-size="38">Lead Rescue — Architecture</text>
  <text x="70" y="105" class="s">Quiet autonomy for small-business lead follow-up using Strands Agents</text>

