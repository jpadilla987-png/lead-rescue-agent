  <text x="100" y="265" class="s">Website · Email · GBP</text>
  <text x="100" y="292" class="s">Real customer inquiries</text>

  <rect x="405" y="165" width="300" height="170" class="core"/>
  <text x="448" y="220" class="t">Strands Agent Loop</text>
  <text x="448" y="258" class="s">Model → tool selection</text>
  <text x="448" y="287" class="s">→ action → reasoning</text>
  <text x="448" y="316" class="s">Professional Agent</text>

  <rect x="810" y="90" width="260" height="120" class="box"/>
  <text x="850" y="140" class="t">Amazon Bedrock</text>
