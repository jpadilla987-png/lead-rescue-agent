name: Amazon Demo Pages

on:
  push:
    branches:
      - amazon-alexa
    paths:
      - "amazon_alexa/demo/**"
      - ".github/workflows/amazon-demo-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "amazon-demo-pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: amazon_alexa/demo
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
