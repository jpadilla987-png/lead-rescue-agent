name: Amazon Demo Pages

# Public deployment is intentionally manual. GitHub Pages is not enabled on
# this repository through the current integration, so automatic deploys would
# create noisy failed runs. Once Pages is enabled by a repository administrator,
# this workflow can be run from the Actions tab.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: amazon_alexa/demo
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
