name: Nebius Secret Presence Check

on:
  push:
    branches:
      - nebius-nighteye
    paths:
      - ".github/workflows/nebius-secret-check.yml"
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check NEBIUS_API_KEY presence without exposing it
        env:
          NEBIUS_API_KEY: ${{ secrets.NEBIUS_API_KEY }}
        run: |
          if [ -n "$NEBIUS_API_KEY" ]; then
            echo "NEBIUS_API_KEY_PRESENT=true"
          else
            echo "NEBIUS_API_KEY_PRESENT=false"
            echo "Live Token Factory inference remains blocked until the repository secret is configured."
          fi
