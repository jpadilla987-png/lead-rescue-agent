name: Qloo TasteBridge CI

on:
  pull_request:
    paths:
      - "qloo_taste_bridge/**"
      - ".github/workflows/qloo-taste-bridge.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.19.0"
      - name: Unit tests
        run: node --test qloo_taste_bridge/test.mjs
